program: src/train_gpt2.py
entity: schaefferlab1
project: namo
name: gpt2xl_namo_1
method: grid
metric:
  name: val/loss
  goal: minimize

parameters:
  optim.learning_rate:
    # values: [0.005, 0.007, 0.009, 0.012, 0.015]
    values: [3.5e-3, 2.15e-3, 1.32e-3, 8.1e-4]

command:
  - ${env}
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  - torchrun
  - --standalone
  - --nproc_per_node=8
  - ${program}
  - hydra.job.chdir=False

  # --- GPT-2 XL PRETRAINING (scratch) ---
  - init_from=scratch

  # GPT-2 XL architecture
  - model.n_layer=48
  - model.n_head=25
  - model.n_embd=1600
  - model.dropout=0.0
  - model.bias=False

  # Sequence + batch settings
  - block_size=1024
  - batch_size=8
  - gradient_accumulation_steps=64

  # optimizer
  - optim=namo
  - wandb_log=1
  - wandb.project=namo
  - wandb.entity=schaefferlab1
  - optim.decay=0
  - ${args_no_hyphens}

  # run length
  - max_iters=10000

  # output organization
  - exp=gpt2xl_pretrain
  - "exp_name=gpt2xl_namo_lr${optim.learning_rate}"
